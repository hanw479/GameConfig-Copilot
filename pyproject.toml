[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameconfig-copilot"
version = "0.1.0"
description = "Game task-configuration copilot: retrieval-grounded drafting, deterministic validation, gated writes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GameConfig Copilot" }]
keywords = ["llm", "rag", "game-config", "agent", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  # config.py degrades to an internal shim when this wheel cannot be installed
  # (offline/air-gapped or sandboxed checkout); see
  # src/gameconfig_copilot/_settings_compat.py and `SETTINGS_BACKEND`.
  "pydantic-settings>=2.2,<3",
  # The constraint DSL corpus (data/constraints/*.yaml) is loaded by the
  # validator (S4-01).
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "rich>=13,<16",
]

[project.optional-dependencies]
# Runtime stays dependency-light: every group below is opt-in, because each
# feature degrades gracefully when its wheel is absent (BM25-only retrieval,
# hand-written JSON in the MCP server, offline evaluation). Install with
# `pip install -e ".[api,rag]"` etc. -- core `dependencies` above is enough to
# run the CLI, schema and validation paths.
#
# S0 minimal set. LangGraph lands with the orchestration layer (S2/S3):
#   "langgraph>=0.2,<1",
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<9",
  "ruff>=0.6,<1",
]
# SSE read-only loop / write closure (S2, S5): `api/main.py`, `api/routes.py`.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Sparse + hybrid retrieval (S1): `rag/stores/bm25s.py` falls back to a pure
# Python ranker when `bm25s` is missing; PyYAML is the constraint-corpus loader.
rag = ["bm25s>=0.2", "PyYAML>=6"]
# Dense lane of the hybrid store; `rag/stores/noop.py` stands in offline.
rag-dense = ["chromadb>=0.5", "sentence-transformers>=3"]
# Evaluation suites beyond the BM25 baseline (S7): `evaluation/`.
eval = ["ragas>=0.2"]
# Optional review UI sketch (S7); nothing in `src/` imports it yet.
ui = ["streamlit>=1.35"]
# MCP server transport (S6): `mcp_server/server.py` uses FastMCP when importable
# and otherwise keeps its own stdio loop, hence the >=3.11 marker only here.
mcp = ["fastmcp>=2; python_version>='3.11'"]

[project.scripts]
gcc = "gameconfig_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gameconfig_copilot*"]

[tool.setuptools.package-data]
gameconfig_copilot = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
markers = [
  "integration: crosses module boundaries but stays offline",
  "e2e: end-to-end flow (may need local fixtures)",
  "slow: noticeably slower than a unit test",
]

[tool.coverage.run]
source = ["gameconfig_copilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gameconfig_copilot"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented style puts typer.Option(...) in defaults.
"src/gameconfig_copilot/cli/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
