# 《星港纪元》活动类约束（C_ACTIVITY_*）
# 活动叠加奖励总额封顶，日常重复次数限定在 1–3 次。
- id: "C_ACTIVITY_STACK_LIMIT_01"
  scope: "activity_rewards.gold"
  type: "sum_limit"
  severity: "error"
  message: "活动叠加金币总额 {actual} 超过 {limit}"
  rationale: "活动是限时加成，叠加后仍要服从经济白皮书的通胀上限，否则档期一开下环物价立刻失控。"
  params:
    limit: 800

- id: "C_ACTIVITY_DAILY_LIMIT_01"
  scope: "activity.daily_repeat_limit"
  type: "range"
  severity: "warning"
  message: "每日重复次数 {actual} 超出 {min}–{max}"
  rationale: "日常任务的日限为 3 次，活动提高次数需要单独评审，否则会把循环产出变成挂机收益。"
  params:
    min: 1
    max: 3
